name: Review Buddy 3D artwork
run-name: Buddy artwork at ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - "feat/**"
      - "codex/**"
    paths:
      - ".github/workflows/buddy-art-review.yml"
      - "src/components/buddy/buddy-3d*.js"
      - "src/components/buddy/buddy-canvas-frame.js"
      - "src/components/buddy/buddy-inspection-frame.js"
      - "src/components/buddy/buddy-assistant.tsx"
      - "src/hooks/use-speech-recognition*"
      - "scripts/site-buddy*.py"
      - "scripts/buddy-depth.test.mjs"
      - "public/images/buddy/3d/**"
  workflow_dispatch:
    inputs:
      speech_only:
        description: "Review speech interactions only; does not certify artwork or publish"
        required: false
        type: boolean
        default: false
      placement_only:
        description: "Review actor placement only; does not certify artwork or publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: buddy-art-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            src
            public
            scripts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check Buddy depth ordering and continuous movement
        run: node --test scripts/buddy-depth.test.mjs scripts/buddy-placement.test.mjs

      # Bundle the actual renderer and its framing helpers separately. This
      # preview workflow has no Pages permissions or deployment step.
      - name: Prepare production Buddy renderer proof
        if: inputs.speech_only != true && inputs.placement_only != true
        run: bun scripts/build-buddy-3d-proof.mjs

      - name: Prepare speech interface preview without publishing
        env:
          STATIC_BUILD: "true"
          BASE_PATH: /
        run: |
          bun run build
          node scripts/pages-postbuild.mjs dist/client

      # Keep the image digest and Python package aligned with deploy.yml.
      - name: Start browser verification container
        timeout-minutes: 5
        run: |
          docker run --detach --init --ipc=host --name buddy-art-review \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work --env CI=true \
            mcr.microsoft.com/playwright/python:v1.65.0-noble@sha256:f9294526294a7bdfb8ca8aa7d815c049125a10e73b65d47fb9a80f5d74f284a6 \
            sleep infinity
          docker exec buddy-art-review python -m pip install playwright==1.65.0 pillow

      - name: Capture and check actual Buddy geometry and gestures
        id: artwork
        if: inputs.speech_only != true && inputs.placement_only != true
        run: docker exec buddy-art-review python scripts/site-buddy-3d.py

      - name: Upload artwork and exact source provenance
        if: ${{ always() && inputs.speech_only != true && inputs.placement_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: buddy-3d-review-${{ github.sha }}
          path: docs/screenshots/wave909/buddy-3d
          retention-days: 7
          if-no-files-found: warn

      - name: Check speech bubbles and microphone draft lifecycle
        if: ${{ !cancelled() && inputs.placement_only != true && (inputs.speech_only == true || steps.artwork.outcome == 'success' || steps.artwork.outcome == 'failure') }}
        env:
          SPEECH_ONLY: ${{ inputs.speech_only }}
        run: |
          if [ "$SPEECH_ONLY" = "true" ]; then
            docker exec buddy-art-review python scripts/site-buddy.py --width 390 --width 1280
          else
            docker exec buddy-art-review python scripts/site-buddy.py \
              --width 390 --width 1280 \
              --case simple-chat-disclosure --case fetch-history-sources \
              --case nonmodal-continuous-conversation --case short-viewport \
              --case inspect-page-details --case speech-input
          fi

      - name: Upload speech interface preview
        if: ${{ always() && inputs.placement_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: buddy-speech-review-${{ github.sha }}
          path: docs/screenshots/wave909/buddy
          retention-days: 7
          if-no-files-found: warn

      - name: Check page and speech placements
        if: inputs.placement_only == true
        run: docker exec buddy-art-review python scripts/site-buddy-placement.py

      - name: Upload placement diagnostics
        if: ${{ always() && inputs.placement_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: buddy-placement-review-${{ github.sha }}
          path: docs/screenshots/wave909/buddy-placement
          retention-days: 7
          if-no-files-found: warn

      - name: Stop review container
        if: always()
        run: docker rm --force buddy-art-review || true
