name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit/tag to take src/ and public/ from (blank = this branch)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ordinary releases need the current source, not historical screenshots.
          # Keep history for the explicit older-source escape hatch below.
          fetch-depth: ${{ inputs.source_ref != '' && '0' || '1' }}
          sparse-checkout: |
            .github
            src
            public
            scripts

      # Escape hatch: build the site content from an older commit while keeping
      # this branch's build config. Used while main is mid-refactor.
      - name: Take site content from ${{ inputs.source_ref }}
        if: inputs.source_ref != ''
        run: git checkout ${{ inputs.source_ref }} -- src public

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A CNAME in public/ means the site is served from a custom domain's
      # root, so assets and the router take no path prefix; without one it is a
      # project page under /<repo>/. Derived from the file rather than read off
      # the Pages settings so the build and the domain cannot drift apart: a
      # project-path build served at a domain root 404s every asset on it.
      - name: Resolve base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "Custom domain $(cat public/CNAME) -> base path /"
          else
            echo "value=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_OUTPUT"
            echo "Project page -> base path ${{ steps.pages.outputs.base_path }}/"
          fi

      - run: bun install --frozen-lockfile

      - name: Validate reviewed FAQ publishing
        run: |
          node --test scripts/publish-faq.test.mjs
          node scripts/publish-faq.mjs --validate

      # Historical content intentionally keeps its own earlier character rig.
      - name: Check Buddy wrist and animation continuity
        if: inputs.source_ref == ''
        run: node --test scripts/buddy-engine.test.mjs scripts/buddy-placement.test.mjs scripts/buddy-ambient.test.mjs

      - name: Prepare real Buddy renderer visual proof
        if: inputs.source_ref == ''
        run: bun scripts/build-buddy-proof.mjs

      # STATIC_BUILD switches vite.config.ts to prerender with no Nitro server.
      - name: Build static site
        env:
          STATIC_BUILD: "true"
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: bun run build

      - name: Rewrite public asset paths, add 404 fallback
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: node scripts/pages-postbuild.mjs dist/client

      # GitHub strips the custom domain on every Actions deploy unless the
      # CNAME travels in the artifact. Vite copies public/ into the output, so
      # this asserts it arrived rather than trusting that it did.
      - name: Verify CNAME survived into the artifact
        run: |
          if [ -f public/CNAME ]; then
            test -f dist/client/CNAME || { echo "CNAME missing from dist/client"; exit 1; }
            echo "CNAME in artifact: $(cat dist/client/CNAME)"
          fi

      # The official image carries all three browsers and their system
      # dependencies, avoiding apt mirror outages on fresh hosted runners.
      # Keep its Playwright version in sync with the Python package below.
      - name: Start browser verification container
        timeout-minutes: 5
        run: |
          docker run --detach --init --ipc=host --name site-browser-checks \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work --env CI=true \
            mcr.microsoft.com/playwright/python:v1.65.0-noble@sha256:f9294526294a7bdfb8ca8aa7d815c049125a10e73b65d47fb9a80f5d74f284a6 \
            sleep infinity
          docker exec site-browser-checks python -m pip install playwright==1.65.0 pillow

      - name: Check Firefox and WebKit scrolling
        run: docker exec site-browser-checks python scripts/site-scroll-smoke.py

      - name: Check pricing and lightweight motion
        run: docker exec site-browser-checks python scripts/site-motion-pricing.py

      - name: Check every page and interactive journeys
        id: browser_checks
        run: docker exec site-browser-checks python scripts/wave909-experience.py

      - name: Check the interactive partner ecosystem
        if: ${{ !cancelled() && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        run: docker exec site-browser-checks python scripts/wave921-ecosystem.py

      - name: Check floating Buddy and real AI states
        if: ${{ !cancelled() && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        run: docker exec site-browser-checks python scripts/site-buddy.py

      - name: Check one Buddy moving between page and chat placements
        if: ${{ !cancelled() && inputs.source_ref == '' && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        run: docker exec site-browser-checks python scripts/site-buddy-placement.py

      - name: Capture and check Buddy views and transformation frames
        if: ${{ !cancelled() && inputs.source_ref == '' && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        run: docker exec site-browser-checks python scripts/site-buddy-artwork.py

      - name: Check the complete local authority carousel
        if: ${{ !cancelled() && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ -n "$SOURCE_REF" ] && [ ! -f public/data/uk-local-authorities.json ]; then
            echo "Older site content has no complete authority carousel; focused gate does not apply."
          else
            docker exec site-browser-checks python scripts/site-authorities.py
          fi

      - name: Verify rendered colour contrast and light page surfaces
        if: ${{ !cancelled() && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        run: |
          docker exec site-browser-checks bash -o pipefail -c \
            'python scripts/wave412-screenshots.py | tee docs/screenshots/wave909/visual-gate.txt'

      - name: Stop browser verification container
        if: always()
        run: docker rm --force site-browser-checks 2>/dev/null || true

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-experience-${{ github.sha }}
          path: |
            docs/screenshots/wave909
            docs/screenshots/wave412
          retention-days: 7

      - name: Preserve ecosystem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-ecosystem-${{ github.sha }}
          path: docs/screenshots/wave921
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
